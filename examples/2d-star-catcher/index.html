<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>BrioJS - Star Catcher (2D example)</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #05070f;
                color: #e2e8f0;
                font-family: system-ui, sans-serif;
            }
            #game canvas {
                display: block;
                max-width: 100vw;
                max-height: 85vh;
                border-radius: 8px;
            }
            #help {
                margin: 12px 0 0;
                line-height: 20px;
                text-align: center;
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <main>
            <div id="game"></div>
            <p id="help">Arrows / WASD / gamepad to move, Space to start, M to mute</p>
        </main>
        <script type="module" src="./main.js"></script>
    </body>
</html>
